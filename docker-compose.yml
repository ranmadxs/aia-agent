version: '3.8'

services:
  # Imagen base para tests/CI
  test:
    build: .
    container_name: aia-test
    command: poetry run pytest -v

  # Desarrollo con hot-reload (monta código local)
  dev:
    build: .
    container_name: aia-dev
    volumes:
      - ./workers:/app/workers
      - ./tests:/app/tests
    command: tail -f /dev/null