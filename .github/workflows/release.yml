name: Release Tag

# Crea un tag anotado vX.Y.Z en cada push a main (= merge de PR).
# Lee la versión de pyproject.toml. Idempotente: si el tag ya existe, lo salta.
# Después de crear el tag, construye y publica la imagen Docker.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Create v* tag from pyproject.toml
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version\s*=\s*"' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "❌ No se pudo extraer la versión de pyproject.toml"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "📦 Versión detectada: ${VERSION} → tag candidato: ${TAG}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  Tag ${TAG} ya existe, saltando creación."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🆕 Tag ${TAG} no existe, se creará."
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (auto-generated from pyproject.toml)"
          git push origin "$TAG"
          echo "✅ Tag ${TAG} creado y pusheado."

      - name: Tag summary
        if: always()
        run: |
          echo "## 🚀 Release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versión en pyproject.toml: \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check_tag.outputs.exists }}" = "true" ]; then
            echo "- Estado: ⏭️  ya existía (no se recreó)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Estado: ✅ creado y pusheado" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Build de release: construye y publica la imagen en Docker Hub ──
  build-and-publish:
    name: Build and Push Docker Image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set docker tag version
        run: |
          VERSION=$(grep -E '^version\s*=\s*"' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "RELEASE_VERSION=v${VERSION}" >> $GITHUB_ENV
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build and push image
        run: |
          IMAGE="keitarodxs/aia-agent:${{ env.RELEASE_VERSION }}"
          docker build -t "$IMAGE" .
          docker tag "$IMAGE" keitarodxs/aia-agent:latest
          docker push "$IMAGE"
          docker push keitarodxs/aia-agent:latest
          docker logout

  # ── Despliegue continuo en nara (best-effort) ───────────────────────────────
  deploy-nara:
    needs: [build-and-publish, release]
    runs-on: [self-hosted, nara]
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Desplegar con docker run en nara
        env:
          AIA_AGENT_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -e
          TAG="${AIA_AGENT_TAG}"
          IMAGE="keitarodxs/aia-agent:${TAG}"
          docker pull "$IMAGE"
          docker stop aia-agent 2>/dev/null || true
          docker rm aia-agent 2>/dev/null || true
          docker run -d --name aia-agent --restart unless-stopped \
            --network=host \
            -p 4000:4000 \
            -v /opt/aia-agent/logs:/app/logs \
            -e OLLAMA_HOST="${{ secrets.OLLAMA_HOST }}" \
            -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            "$IMAGE"
          echo "Despliegue en nara completado (imagen: $IMAGE)"

  # ── Verificación post‑deploy en nara ──────────────────────────────────
  verify-nara:
    needs: deploy-nara
    if: ${{ success() }}
    runs-on: [self-hosted, nara]
    steps:
      - name: Verificar contenedor en nara
        run: |
          # 1. El contenedor debe estar running
          docker ps --filter name=aia-agent --filter status=running --format '{{.Names}}' | grep -q aia-agent \
            && echo "✅ Container running" \
            || (echo "❌ Container no está running" && exit 1)

          # 2. Verificar que no hay errores críticos en logs
          sleep 5
          if docker logs aia-agent 2>&1 | tail -30 | grep -qi "error\|traceback\|abortando"; then
            echo "❌ Errores en logs" && docker logs aia-agent 2>&1 | tail -20 && exit 1
          fi
          echo "✅ Sin errores en logs"
