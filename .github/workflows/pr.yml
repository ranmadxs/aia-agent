name: PR Checks

# Dispara SOLO en PRs contra main.
# - Tests se ejecutan como required checks del PR (regla de branch protection).
# - En push a main (merge) este workflow NO corre: ese escenario lo cubre `release.yml`
#   (auto-tag) y, si en el futuro se quieren tests post-merge, van en un workflow aparte
#   para no contaminar el resultado del PR con ejecuciones que pasan/escanean main.
on:
  pull_request:
    branches: [main]

# Permisos: solo lectura por defecto. Se eleva a 'write' para comentar el PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================
  # Job 0: Semver Check (solo en PR; en push a main no se exige bump extra)
  # ============================================================
  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    # Solo en PRs (no en push directo a main ni en re-run manual de un push).
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check pyproject.toml was bumped
        run: |
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Comparando pyproject.toml entre ${BASE_SHA:0:7} (base) y ${HEAD_SHA:0:7} (head)"
            if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -q '^pyproject\.toml$'; then
              echo "✅ pyproject.toml modificado en el PR"
              git diff "${BASE_SHA}" "${HEAD_SHA}" -- pyproject.toml
            else
              echo "❌ pyproject.toml NO fue modificado en este PR"
              echo ""
              echo "Política del proyecto: TODO PR debe bumpear la versión en"
              echo "pyproject.toml siguiendo semver:"
              echo "  - fix      → patch  (X.Y.Z+1)"
              echo "  - feat     → minor  (X.Y+1.0)"
              echo "  - BREAKING → major  (X+1.0.0)"
              echo ""
              echo "Editá pyproject.toml y bumpeá [project] version."
              exit 1
            fi

  # ============================================================
  # Job 1: Unit Tests (minimal CI tests)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: semver-check

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry --version

      - name: Cache Poetry venv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project false
          poetry install --with dev --no-interaction --no-ansi --no-root

      - name: Run unit tests
        run: |
          poetry run pytest tests/test_ci.py \
            --junitxml=junit-report.xml \
            -v

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: junit-report.xml
          retention-days: 7
          if-no-files-found: warn