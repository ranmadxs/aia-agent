name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  semver-check:
    name: Semver Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check pyproject.toml was bumped
        run: |
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "Comparando pyproject.toml entre ${BASE_SHA:0:7} (base) y ${HEAD_SHA:0:7} (head)"
            if git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -q '^pyproject\.toml$'; then
              echo "✅ pyproject.toml modificado en el PR"
              git diff "${BASE_SHA}" "${HEAD_SHA}" -- pyproject.toml
            else
              echo "❌ pyproject.toml NO fue modificado en este PR"
              echo ""
              echo "Política del proyecto: TODO PR debe bumpear la versión en"
              echo "pyproject.toml siguiendo semver:"
              echo "  - fix      → patch  (X.Y.Z+1)"
              echo "  - feat     → minor  (X.Y+1.0)"
              echo "  - BREAKING → major  (X+1.0.0)"
              echo ""
              echo "Editá pyproject.toml y bumbeá [project] version."
              exit 1
            fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check if any job failed
        if: always()
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          FAILED=$(echo "$RESPONSE" | python3 -c "import sys,json;[print(j['name']) for j in json.load(sys.stdin)['jobs'] if j['name']!='${{ github.job }}' and j['conclusion'] in ('failure','cancelled','skipped')][:1]")
          if [ -n "$FAILED" ]; then
            echo "❌ Job $FAILED failed, skipping"
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Poetry
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install poetry --break-system-packages
          poetry --version

      - name: Cache Poetry venv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project false
          poetry install --with dev --no-interaction --no-ansi --no-root

      - name: Run unit tests
        run: |
          poetry run pytest tests/test_ci.py \
            --junitxml=junit-report.xml \
            -v

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: junit-report.xml
          retention-days: 7
          if-no-files-found: warn

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check if any job failed
        if: always()
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          FAILED=$(echo "$RESPONSE" | python3 -c "import sys,json;[print(j['name']) for j in json.load(sys.stdin)['jobs'] if j['name']!='${{ github.job }}' and j['conclusion'] in ('failure','cancelled','skipped')][:1]")
          if [ -n "$FAILED" ]; then
            echo "❌ Job $FAILED failed, skipping"
            exit 1
          fi
        shell: bash

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          VERSION=$(grep -E '^version\s*=\s*"' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          IMAGE="aia-agent-test:${VERSION}"
          docker build -t "$IMAGE" .
          echo "✅ Docker image built successfully: $IMAGE"
